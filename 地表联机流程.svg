<svg xmlns="http://www.w3.org/2000/svg" width="950" height="420" viewBox="0 0 950 420" role="img" aria-labelledby="title desc">
  <title id="title">地表联机攻防方案</title>
  <desc id="desc">B 的基地和防守雇员快照加 A 的进攻雇员副本构成临时战场，主机运行原模拟，A 和 B 的客户端只发送自己的雇员命令并展示状态。B 离线由 AI 防守，在线接管同一批角色。结果一次性结算。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9fb7ce"/></marker></defs>
  <rect width="950" height="420" rx="16" fill="#101b29"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="24" y="37" fill="#edf5fc" font-size="22" font-weight="bold">地表攻防：独立战场，复用原战斗规则</text>
    <g fill="#304b65"><rect x="24" y="66" width="224" height="65" rx="9"/><rect x="24" y="150" width="224" height="65" rx="9"/></g>
    <g text-anchor="middle" fill="#f4f8fc" font-size="17"><text x="136" y="94">B 基地＋防守雇员</text><text x="136" y="178">A 进攻雇员＋装备</text></g>
    <g text-anchor="middle" fill="#b8cfe2" font-size="13"><text x="136" y="118">独立快照 / 基地版本</text><text x="136" y="202">副本 / UID 重映射</text></g>
    <path d="M255 98H280V140H310M255 182H280V140" fill="none" stroke="#9fb7ce" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="66" width="274" height="149" rx="12" fill="#234653"/>
    <text x="462" y="99" text-anchor="middle" fill="#79caf7" font-size="19" font-weight="bold">主机的临时战场</text>
    <text x="462" y="133" text-anchor="middle" fill="#e1eef7" font-size="16">MapManager / 原 AI / 原伤害</text>
    <text x="462" y="163" text-anchor="middle" fill="#c1d7e8" font-size="15">统一时钟 / 控制归属</text>
    <text x="462" y="193" text-anchor="middle" fill="#a8c5d9" font-size="14">隔离原档保存与经营事件</text>
    <path d="M607 119H651" stroke="#9fb7ce" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="629" y="106" text-anchor="middle" fill="#a9c4da" font-size="12">状态</text>
    <path d="M651 159H607" stroke="#9fb7ce" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="629" y="186" text-anchor="middle" fill="#a9c4da" font-size="12">指令</text>
    <rect x="666" y="66" width="260" height="149" rx="12" fill="#28564f"/>
    <text x="796" y="99" text-anchor="middle" fill="#eafcf5" font-size="19" font-weight="bold">A / B 客户端</text>
    <text x="796" y="133" text-anchor="middle" fill="#d8ece6" font-size="16">各自控制自己的雇员</text>
    <text x="796" y="163" text-anchor="middle" fill="#c0ded3" font-size="15">位置、动作、血量与受击展示</text>
    <text x="796" y="193" text-anchor="middle" fill="#a9ccc0" font-size="14">动画回调不再计算伤害</text>
    <rect x="24" y="248" width="402" height="77" rx="10" fill="#304b65"/>
    <text x="42" y="278" fill="#edf6fc" font-size="17">B 离线：AI 防守</text>
    <text x="42" y="305" fill="#c0d5e5" font-size="15">B 上线：接管同一批雇员；掉线回自动</text>
    <path d="M462 224V283H501" fill="none" stroke="#9fb7ce" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="517" y="248" width="409" height="77" rx="10" fill="#644c3e"/>
    <text x="536" y="278" fill="#fbf1e9" font-size="17">战报与一次性结算</text>
    <text x="536" y="305" fill="#e4cdbb" font-size="15">伤亡 / 建筑损伤 / 资源变动 / 基地版本</text>
    <text x="24" y="365" fill="#c0d6e6" font-size="15">首个原型：固定小图、双方少量雇员、移动与攻击、离线 AI 与在线接管。</text>
    <text x="24" y="394" fill="#95b0c5" font-size="13">计划方案，尚未实现；原型使用战场副本，不写永久损失。</text>
  </g>
</svg>
