<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
  <title id="title">MOD 联机兼容与扩展流程设计</title>
  <desc id="desc">房主与客人完成加载和兼容检查，命令由房主校验交给唯一模拟端，确认后的原生与扩展状态同步并同代保存。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d8bbd"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6eefc}.h{font-size:24px;font-weight:700}.t{font-size:18px;font-weight:600}.s{font-size:15px;fill:#b9c8e2}.box{fill:#182840;stroke:#476b9b;stroke-width:1.5}.line{fill:none;stroke:#6d8bbd;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="740" rx="20" fill="#0c1627"/>
  <text x="42" y="48" class="h">相同 MOD 环境 + 显式同步适配</text>
  <text x="42" y="76" class="s">接口设计稿 · 2026-10-19 · 未实现功能</text>
  <rect x="42" y="106" width="320" height="103" rx="12" class="box"/>
  <text x="64" y="138" class="t">房主：成功加载的 MOD</text>
  <text x="64" y="165" class="s">包身份、内容、配置、依赖与顺序</text>
  <text x="64" y="190" class="s">续开时还需匹配存档中的环境</text>
  <rect x="758" y="106" width="320" height="103" rx="12" class="box"/>
  <text x="780" y="138" class="t">客人：成功加载的 MOD</text>
  <text x="780" y="165" class="s">同一套共享内容与适配能力</text>
  <text x="780" y="190" class="s">已确认纯本地 MOD 可不同</text>
  <path d="M362 155H400" class="line"/>
  <path d="M758 155H720" class="line"/>
  <rect x="404" y="106" width="312" height="103" rx="12" fill="#163934" stroke="#51b5a2"/>
  <text x="427" y="138" class="t">入房兼容检查</text>
  <text x="427" y="165" class="s">冻结注册表，协商协议与环境</text>
  <text x="427" y="190" class="s">不一致则提示，先不创建玩家资产</text>
  <path d="M560 209V250" class="line"/>
  <rect x="404" y="255" width="312" height="88" rx="12" class="box"/>
  <text x="427" y="289" class="t">第三方 MOD / 兼容补丁</text>
  <text x="427" y="319" class="s">注册命令、状态、保存与必要类型适配</text>
  <path d="M560 343V382" class="line"/>
  <rect x="42" y="388" width="305" height="100" rx="12" class="box"/>
  <text x="64" y="421" class="t">玩家发起操作</text>
  <text x="64" y="448" class="s">例如：让新增熔炉开始生产</text>
  <text x="64" y="473" class="s">提交请求，不自报资产结算结果</text>
  <path d="M347 438H399" class="line"/>
  <rect x="404" y="388" width="312" height="100" rx="12" fill="#163934" stroke="#51b5a2"/>
  <text x="427" y="421" class="t">房主校验与路由</text>
  <text x="427" y="448" class="s">身份、权限、UID、任期和重复命令</text>
  <text x="427" y="473" class="s">地图操作交给该图唯一模拟端</text>
  <path d="M716 438H753" class="line"/>
  <rect x="758" y="388" width="320" height="100" rx="12" class="box"/>
  <text x="780" y="421" class="t">唯一模拟端执行</text>
  <text x="780" y="448" class="s">可能是房主，也可能是指定客人</text>
  <text x="780" y="473" class="s">只扣一次材料，产出关联状态提交</text>
  <path d="M918 488V542H716" class="line"/>
  <rect x="404" y="514" width="312" height="90" rx="12" fill="#163934" stroke="#51b5a2"/>
  <text x="427" y="547" class="t">房主确认完整提交</text>
  <text x="427" y="576" class="s">原生状态与 MOD 状态保持同一边界</text>
  <path d="M404 559H347" class="line"/>
  <rect x="42" y="514" width="305" height="90" rx="12" class="box"/>
  <text x="64" y="547" class="t">其他客户端应用与显示</text>
  <text x="64" y="576" class="s">含迟加入与重连基线，不重复模拟</text>
  <path d="M560 604V635" class="line"/>
  <rect x="245" y="640" width="630" height="63" rx="12" class="box"/>
  <text x="270" y="667" class="t">同一 SaveGeneration 保存与恢复</text>
  <text x="270" y="690" class="s">环境记录 + 原生状态 + 扩展块；玩家数据仍按 PlayerId 隔离</text>
  <text x="42" y="727" class="s">边界：安装相同 MOD 不能替代同步适配；不开放网络选类型或任意反射调用。</text>
</svg>
